<!-- ======================================================== -->
<!-- STYLE DHIS2 PRO : SECTION 5 - INFORMATIONS SUR L'ÉCHANTILLON -->
<!-- ======================================================== -->
<div class="bg-[#2C6693] text-white px-4 py-2.5 flex items-center justify-between border-b border-blue-900 rounded-t font-sans" id="_section_5">
    <div class="flex items-center gap-2">
        <span class="bg-white/20 text-white text-[10px] font-mono font-bold px-2 py-0.5 rounded uppercase tracking-wider">
           5.0
        </span>
        <h3 class="text-xs font-bold uppercase tracking-wide">
            Informations sur l'échantillon / Sample Information
        </h3>
    </div>
    <div class="hidden sm:flex items-center gap-1.5 text-blue-100 text-[11px] font-mono">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        </svg>
        <span>SAMPLE METADATA</span>
    </div>
</div>

<!-- Corps du formulaire - Style DHIS2 Pro -->
<div class="bg-white border border-slate-300 rounded-b shadow-2xs font-sans space-y-4 p-4 text-xs">

    <!-- 21. CALENDRIER DE PRELEVEMENT -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
        <!-- Date de prélèvement -->
        <div class="space-y-1">
            <label class="font-bold text-slate-700 block uppercase text-[10px] tracking-wider">
                21. Date du prélèvement <span class="text-slate-400 font-normal lowercase">/ Date Of Sample Collection</span> <span class="text-red-600">*</span>
            </label>
            <input type="date" name="date_prelevement" required
                   class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-slate-900 text-xs focus:outline-none focus:border-[#2C6693] focus:ring-1 focus:ring-[#2C6693]">
        </div>

        <!-- Re-prélèvement -->
        <div class="space-y-1">
            <label for="is_reprelevement" class="font-bold text-slate-700 block uppercase text-[10px] tracking-wider">
                Re-prélèvement <span class="text-slate-400 font-normal lowercase">/ Recollected</span> <span class="text-red-600">*</span>
            </label>
            <select name="duplicate_prelevement" id="is_reprelevement" required
                    class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-slate-900 text-xs focus:outline-none focus:border-[#2C6693] focus:ring-1 focus:ring-[#2C6693] cursor-pointer">
                <option value="non">Non / No</option>
                <option value="oui">Oui / Yes</option>
            </select>  
        </div>
    </div>

    <div class="border-t border-slate-200 my-1"></div>

    <!-- 22. CONTACT DU PRELEVEUR -->
    <div class="space-y-2 pt-1">
        <span class="text-[10px] bg-slate-700 text-white px-2 py-0.5 rounded font-mono uppercase font-bold tracking-wider block w-fit">
            22. Contact du préleveur / Contact of Health Personnel Collecting Sample
        </span>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-3 items-end">
            <!-- Nom du Préleveur -->
            <div class="space-y-1 lg:col-span-4">
                <label class="font-bold text-slate-700 block uppercase text-[10px] tracking-wider">
                    Nom <span class="text-slate-400 font-normal lowercase">/ Surname</span>
                </label>
                <input type="text" name="nom_preleveur" placeholder="Ex: Mbianda" 
                       class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-slate-900 font-medium text-xs focus:outline-none focus:border-[#2C6693] focus:ring-1 focus:ring-[#2C6693]">
            </div>
            <!-- Prénom du Préleveur -->
            <div class="space-y-1 lg:col-span-4">
                <label class="font-bold text-slate-700 block uppercase text-[10px] tracking-wider">
                    Prénom <span class="text-slate-400 font-normal lowercase">/ First name</span>
                </label>
                <input type="text" name="prenom_preleveur" placeholder="Ex: Jean-Pierre" 
                       class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-slate-900 font-medium text-xs focus:outline-none focus:border-[#2C6693] focus:ring-1 focus:ring-[#2C6693]">
            </div>
            <!-- Contact Réseau -->
            <div class="space-y-1 lg:col-span-4">
                <label class="font-bold text-slate-700 block uppercase text-[10px] tracking-wider">
                    Contact <span class="text-slate-400 font-normal lowercase">/ Collector's phone</span> <span class="text-red-600"></span>
                </label>
                <input type="number" name="contact_preleveur"  placeholder="Ex: 677123456" 
                       class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-slate-900 font-medium text-xs focus:outline-none focus:border-[#2C6693] focus:ring-1 focus:ring-[#2C6693]">
            </div>
        </div>

        <!-- Observations -->
        <div class="space-y-1 pt-1">
            <label class="font-bold text-slate-700 block uppercase text-[10px] tracking-wider">
                Observations de laboratoire <span class="text-slate-400 font-normal lowercase">/ Laboratory notes</span>
            </label>
            <textarea name="observation" rows="3" placeholder="Ex: Intégrité de la chaîne de froid vérifiée, échantillon conforme..." 
                      class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-slate-900 font-medium text-xs resize-none focus:outline-none focus:border-[#2C6693] focus:ring-1 focus:ring-[#2C6693]"></textarea>
        </div>
    </div>

    <!-- Actions -->
    <div class="pt-3 flex justify-end gap-2 border-t border-slate-200 mt-3">
        <!-- Bouton Retour / Annuler -->
        <a href="" 
           class="px-3 py-1.5 border border-slate-300 font-bold bg-white text-slate-700 rounded shadow-2xs hover:bg-slate-50 transition-colors uppercase tracking-wider text-[10px] flex items-center justify-center">
            Retour
        </a>
        
        <!-- Bouton Soumission -->
        <button type="submit" 
                class="px-4 py-1.5 border border-[#2C6693] font-bold bg-[#2C6693] text-white rounded shadow-2xs hover:bg-[#235275] focus:outline-none focus:ring-1 focus:ring-[#2C6693] transition-colors uppercase tracking-wider text-[10px] cursor-pointer">
            Valider et Créer l'Échantillon
        </button>
    </div>
</div>

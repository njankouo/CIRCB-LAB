           title="Veuillez respecter le format JJ-MM-AAAA (ex: 15-08-2000)"
           class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-slate-900 text-xs focus:outline-none focus:border-[#2C6693] focus:ring-1 focus:ring-[#2C6693]">

<!-- Âge -->
<div class="space-y-1">
    <label class="font-bold text-slate-700 block uppercase text-[10px] tracking-wider" for="main_mere_age">
        Âge (ans) <span class="text-slate-400 font-normal lowercase">/ Age</span> <span class="text-red-600">*</span>
    </label>
    <input type="number" 
           name="mere_age" 
           id="main_mere_age" 
           required 
           placeholder="Ex: 28" 
           min="10" 
           max="85"
           class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-slate-900 font-medium text-xs focus:outline-none focus:border-[#2C6693] focus:ring-1 focus:ring-[#2C6693]">
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const dateInput = document.getElementById('main_mere_date_naissance');
    const ageInput = document.getElementById('main_mere_age');

    let isUpdating = false;

    // 1. Saisie de la DATE DE NAISSANCE (Format JJ-MM-AAAA) -> Calcul de l'Âge
    dateInput.addEventListener('input', function (e) {
        if (isUpdating) return;

        // Formate automatiquement avec les tirets (JJ-MM-AAAA)
        let value = e.target.value.replace(/\D/g, ''); // Garde uniquement les chiffres
        if (value.length > 8) value = value.slice(0, 8);

        if (value.length >= 5) {
            e.target.value = value.slice(0, 2) + '-' + value.slice(2, 4) + '-' + value.slice(4);
        } else if (value.length >= 3) {
            e.target.value = value.slice(0, 2) + '-' + value.slice(2);
        } else {
            e.target.value = value;
        }

        // Calcul de l'âge si la date est complète (10 caractères: JJ-MM-AAAA)
        if (e.target.value.length === 10) {
            const parts = e.target.value.split('-');
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);

            const birthDate = new Date(year, month, day);
            const today = new Date();

            if (!isNaN(birthDate.getTime()) && birthDate <= today && year > 1900) {
                let age = today.getFullYear() - birthDate.getFullYear();
                const monthDiff = today.getMonth() - birthDate.getMonth();
                
                if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }

                if (age >= 10 && age <= 85) {
                    isUpdating = true;
                    ageInput.value = age;
                    isUpdating = false;
                }
            }
        }
    });

    // 2. Saisie de l'ÂGE -> Génère au format JJ-MM-AAAA
    ageInput.addEventListener('input', function (e) {
        if (isUpdating) return;

        const age = parseInt(e.target.value, 10);

        if (!isNaN(age) && age >= 10 && age <= 85) {
            const today = new Date();
            const birthYear = today.getFullYear() - age;
            
            // Formatage du jour et du mois sur 2 chiffres
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');

            // Format final : JJ-MM-AAAA
            const generatedDateFormatted = `${day}-${month}-${birthYear}`;

            isUpdating = true;
            dateInput.value = generatedDateFormatted;
            isUpdating = false;
        } else if (e.target.value === '') {
            isUpdating = true;
            dateInput.value = '';
            isUpdating = false;
        }
    });
});
</script>

<script>
    function toggleProtocoleAutre(select) {
        const container = document.getElementById('champ_protocole_autre');
        const input = document.getElementById('protocole_ptme_autre');
        
        if (select.value === 'Autre / Other') {
            container.classList.remove('hidden');
            input.setAttribute('required', 'required');
            input.focus();
        } else {
            container.classList.add('hidden');
            input.removeAttribute('required');
            input.value = '';
        }
    }
</script>

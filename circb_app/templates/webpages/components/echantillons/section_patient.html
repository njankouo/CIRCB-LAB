<!-- Optionnel : Champ Âge calculé pour l'enfant -->


<script>
document.addEventListener('DOMContentLoaded', function () {
    const dobInput = document.getElementById('enfant_dob');
    const ageInput = document.getElementById('enfant_age');

    dobInput.addEventListener('input', function (e) {
        // 1. Masque automatique avec tirets (JJ-MM-AAAA)
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 8) value = value.slice(0, 8);

        if (value.length >= 5) {
            e.target.value = value.slice(0, 2) + '-' + value.slice(2, 4) + '-' + value.slice(4);
        } else if (value.length >= 3) {
            e.target.value = value.slice(0, 2) + '-' + value.slice(2);
        } else {
            e.target.value = value;
        }

        // 2. Calcul automatique de l'âge si la date est complète
        if (e.target.value.length === 10) {
            const parts = e.target.value.split('-');
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);

            const birthDate = new Date(year, month, day);
            const today = new Date();

            if (!isNaN(birthDate.getTime()) && birthDate <= today && year > 1900) {
                let years = today.getFullYear() - birthDate.getFullYear();
                let months = today.getMonth() - birthDate.getMonth();
                let days = today.getDate() - birthDate.getDate();

                if (days < 0) {
                    months--;
                }
                if (months < 0) {
                    years--;
                    months += 12;
                }

                // Affichage intelligent selon l'âge de l'enfant
                if (ageInput) {
                    if (years >= 1) {
                        ageInput.value = `${years} ans`;
                    } else if (months >= 1) {
                        ageInput.value = `${months} mois`;
                    } else {
                        const diffTime = Math.abs(today - birthDate);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        ageInput.value = `${diffDays} jour(s)`;
                    }
                }
            } else if (ageInput) {
                ageInput.value = '';
            }
        } else if (ageInput) {
            ageInput.value = '';
        }
    });
});
</script>

<script>
    // --- CALCUL AUTOMATIQUE DE L'ÂGE PÉDIATRIQUE ---
    document.getElementById('enfant_dob').addEventListener('change', function() {
        const dobValue = this.value;
        if (!dobValue) return;

        const dob = new Date(dobValue);
        const now = new Date();
        const diffTime = now - dob;
        
        if (diffTime < 0) {
            document.getElementById('enfant_age_display').value = "Date invalide (futur)";
            return;
        }

        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const diffWeeks = Math.floor(diffDays / 7);
        const diffMonths = Math.floor(diffDays / 30.4375);

        let ageText = "";
        
        if (diffMonths >= 24) {
            const years = Math.floor(diffMonths / 12);
            ageText = years + " an(s)";
        } else if (diffMonths >= 1) {
            ageText = diffMonths + " mois";
        } else {
            ageText = diffWeeks + " semaine(s)";
        }

        document.getElementById('enfant_age_display').value = ageText;
        document.getElementById('enfant_age_raw').value = diffMonths;
    });
</script>

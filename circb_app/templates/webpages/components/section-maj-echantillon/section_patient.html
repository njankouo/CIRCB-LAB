            <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">
                7. Prophylaxie ARV Donn&eacute;e a l'enfant<span class="text-slate-400 font-normal lowercase">/ Prophylaxie ARV given to child</span>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <!-- Prophylaxie ARV -->
        <div class="space-y-1.5">
    <label class="font-bold text-slate-700 block uppercase text-[10px] tracking-wider">
        Prophylaxie administrée à l'enfant <span class="text-slate-400 font-normal lowercase">/ Prophylaxis Given to child</span>
    </label>
    
    <div class="relative">
        <select name="profilaxie_arv" 
                onchange="
                    const inputWrapper = document.getElementById('autre_profilaxie_wrapper');
                    const inputField = document.getElementById('autre_profilaxie_arv');
                    if (this.value === 'Autre/Other') {
                        inputWrapper.classList.remove('hidden');
                        setTimeout(() => {
                            inputWrapper.classList.remove('opacity-0', '-translate-y-2');
                            inputWrapper.classList.add('opacity-100', 'translate-y-0');
                        }, 10);
                    } else {
                        inputWrapper.classList.remove('opacity-100', 'translate-y-0');
                        inputWrapper.classList.add('opacity-0', '-translate-y-2');
                        setTimeout(() => {
                            inputWrapper.classList.add('hidden');
                            if (inputField) inputField.value = '';
                        }, 200);
                    }
                "
                class="w-full px-2.5 py-2 border border-slate-300 rounded-lg bg-white text-slate-900 text-xs font-medium focus:outline-none focus:border-[#2C6693] focus:ring-2 focus:ring-[#2C6693]/20 cursor-pointer shadow-xs transition-all duration-200">

            <!-- Date d'initiation -->
           <div class="space-y-1">

        Date d'initiation <span class="text-slate-400 font-normal lowercase">/ Initiation Date</span>

           name="date_initiation_arv" 
           value="{{ echantillon.date_initiation_profilaxie_arv|date:'d-m-Y' }}"
           placeholder="JJ-MM-AAAA"
           pattern="\d{2}-\d{2}-\d{4}"
           maxlength="10"
           oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/^(\d{2})(\d)/, '$1-$2').replace(/^(\d{2}-\d{2})(\d)/, '$1-$2');"
           class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-slate-900 text-xs focus:outline-none focus:border-[#2C6693] focus:ring-1 focus:ring-[#2C6693]">
</div>
        </div>

<script>
    // --- CALCUL AUTOMATIQUE DE L'ÂGE PÉDIATRIQUE ---
    document.getElementById('enfant_dob').addEventListener('change', function() {
        const dobValue = this.value;
        if (!dobValue) return;

        const dob = new Date(dobValue);
        const now = new Date();
        const diffTime = now - dob;
        
        if (diffTime < 0) {
            document.getElementById('enfant_age_display').value = "Date invalide (futur)";
            return;
        }

        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const diffWeeks = Math.floor(diffDays / 7);
        const diffMonths = Math.floor(diffDays / 30.4375);

        let ageText = "";
        
        if (diffMonths >= 24) {
            const years = Math.floor(diffMonths / 12);
            ageText = years + " an(s)";
        } else if (diffMonths >= 1) {
            ageText = diffMonths + " mois";
        } else {
            ageText = diffWeeks + " semaine(s)";
        }

        document.getElementById('enfant_age_display').value = ageText;
        document.getElementById('enfant_age_raw').value = diffMonths;
    });
</script>

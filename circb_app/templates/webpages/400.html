<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable | MEDISYS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(12deg); }
            50% { transform: translateY(-20px) rotate(15deg); }
        }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-6">

    <div class="max-w-2xl w-full text-center">
        <div class="relative mb-12">
            <h1 class="text-[150px] md:text-[200px] font-black text-slate-200 leading-none select-none">404</h1>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="floating w-32 h-32 bg-red-600 rounded-[2.5rem] shadow-2xl shadow-red-200 flex items-center justify-center">
                    <i class="fas fa-search text-white text-5xl"></i>
                </div>
            </div>
        </div>

        <div class="space-y-4 mb-10">
            <h2 class="text-3xl font-extrabold text-slate-900 uppercase tracking-tighter">Oups ! Page perdue.</h2>
            <p class="text-slate-500 max-w-md mx-auto leading-relaxed">
                Le module ou le test que vous recherchez semble avoir déménagé ou n'a jamais existé. Ne vous inquiétez pas, votre préparation continue ici.
            </p>
        </div>

     

        <button onclick="window.history.back()" class="mt-12 text-slate-400 hover:text-red-600 transition-colors flex items-center gap-2 mx-auto text-xs font-black uppercase tracking-widest">
            <i class="fas fa-arrow-left"></i> Revenir en arrière
        </button>
    </div>

</body>
</html>

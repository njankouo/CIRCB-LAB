{% extends '../dashbord_hosp.html' %}

{% block main %}
<!-- Conteneur des notifications (Fixed pour rester visible au scroll) -->
<div id="toast-container" class="fixed top-24 right-8 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

<main class="flex-1 h-full overflow-y-auto p-4 sm:p-8 bg-slate-100">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- EN-TÊTE DU FORMULAIRE -->
        <div class="bg-white border-2 border-slate-900 rounded-2xl p-6 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="px-2 py-0.5 bg-cyan-100 text-cyan-800 text-[10px] font-black font-mono uppercase tracking-wider rounded border border-cyan-300">
                        FICHE N° 4 • LIMS
                    </span>
                </div>
                <h1 class="text-xl sm:text-2xl font-black text-slate-900 font-mono uppercase tracking-tight">
                    Fiche d'Expédition des Échantillons & Résultats
                </h1>
                <p class="text-xs font-semibold text-slate-500 tracking-wider uppercase mt-0.5">
                    Form for results / samples delivery (Form 4)
                </p>
            </div>
        </div>
        
        <!-- FORMULAIRE PRINCIPAL -->
        <form method="POST" action="{% url 'enregistrer_fiche_echantillon' %}" 
              class="bg-white p-6 sm:p-8 rounded-2xl border-2 border-slate-900 shadow-[6px_6px_0px_0px_rgba(15,23,42,1)] space-y-8">
            {% csrf_token %}

            <!-- HEADER CODE FICHE & DATE - STYLE LIMS / ERP -->
            <div class="bg-slate-50 border-2 border-slate-900 rounded-2xl p-5 shadow-[3px_3px_0px_0px_rgba(15,23,42,1)]">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-5">
                    
                    <!-- BLOC 1 : CODE FICHE ÉCHANTILLON -->
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="relative flex h-2.5 w-2.5">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-600"></span>
                            </span>
                            <label for="code" class="text-[10px] font-black text-slate-900 uppercase tracking-widest font-mono">
                                Code Fiche Échantillon
                            </label>
                        </div>
                        
                        <!-- Carte Code Rouge Illustrative -->
                        <div class="relative flex items-center justify-between bg-gradient-to-r from-red-600 via-rose-600 to-red-700 border-2 border-slate-900 rounded-xl p-3 sm:p-3.5 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] text-white overflow-hidden">
                            
                            <!-- Motif filigrane code-barres -->
                            <div class="absolute right-1 -bottom-4 opacity-15 pointer-events-none text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-24 h-24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 5v14"/><path d="M8 5v14"/><path d="M12 5v14"/><path d="M17 5v14"/><path d="M21 5v14"/></svg>
                            </div>

                            <div class="flex items-center gap-3 z-10 w-full">
                                <div class="w-10 h-10 rounded-lg bg-black/25 border border-white/20 flex items-center justify-center shrink-0 backdrop-blur-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 9h10"/><path d="M7 12h10"/><path d="M7 15h10"/></svg>
                                </div>

                                <!-- Input Code Fiche (ID ET NAME CONSERVÉS) -->
                                <input type="text" id="code" name="code" readonly 
                                       value="ECH-2026-98402"
                                       class="w-full font-mono text-xl sm:text-2xl font-black text-white bg-transparent border-none p-0 tracking-widest cursor-default focus:ring-0 focus:outline-none drop-shadow-md">
                            </div>

                            <span class="z-10 shrink-0 px-2.5 py-1 bg-white/20 backdrop-blur-md rounded-md text-[9px] font-black uppercase tracking-widest font-mono text-white border border-white/30 hidden sm:inline-block">
                                UNIQUE ID
                            </span>
                        </div>
                    </div>

                    <!-- SÉPARATEUR DE SECTION -->
                    <div class="hidden md:block w-0.5 h-14 bg-slate-300 shrink-0"></div>

                    <!-- BLOC 2 : DATE D'ENREGISTREMENT (ID ET NAME CONSERVÉS) -->
                    <div class="w-full md:w-64 shrink-0">
                        <label for="date_enregistrement" class="block text-[10px] font-black text-slate-900 uppercase tracking-widest font-mono mb-2">
                            Date d'enregistrement <span class="text-red-600">*</span>
                        </label>
                        <div class="relative">
                            <input type="date" id="date_enregistrement" name="date_enregistrement" required 
                                   class="w-full font-mono text-xs sm:text-sm font-bold text-slate-900 bg-white border-2 border-slate-900 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                        </div>
                    </div>

                </div>
            </div>

            <!-- SECTION 1 : LOCALISATION SANITAIRE -->
            <div class="space-y-4">
                <div class="flex items-center gap-2 border-b-2 border-slate-900 pb-2">
                    <span class="w-2 h-2 bg-cyan-600 rounded-full"></span>
                    <h2 class="text-xs font-black font-mono text-slate-900 uppercase tracking-wider">01. Localisation Sanitaire</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Région / Region <span class="text-red-600">*</span></label>
                    <select name="region" id="select-region" required class="md:col-span-2 w-full font-medium text-xs sm:text-sm bg-slate-50 border-2 border-slate-900 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                        <option value="">Sélectionner...</option>
                        {% for r in regions %} <option value="{{ r.id }}">{{ r.nom }}</option> {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">District de Santé / Health District <span class="text-red-600">*</span></label>
                    <select name="district" id="select-district" required disabled class="md:col-span-2 w-full font-medium text-xs sm:text-sm bg-slate-100 border-2 border-slate-400 rounded-xl p-3 text-slate-500 disabled:cursor-not-allowed transition-all"></select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Formation Sanitaire / Hospital <span class="text-red-600">*</span></label>
                    <select name="fosa" id="select-fosa" required disabled class="md:col-span-2 w-full font-medium text-xs sm:text-sm bg-slate-100 border-2 border-slate-400 rounded-xl p-3 text-slate-500 disabled:cursor-not-allowed transition-all"></select>
                </div>
            </div>

            <!-- SECTION 2 : EXPÉDITION & TRANSPORT -->
            <div class="space-y-4 pt-2">
                <div class="flex items-center gap-2 border-b-2 border-slate-900 pb-2">
                    <span class="w-2 h-2 bg-indigo-600 rounded-full"></span>
                    <h2 class="text-xs font-black font-mono text-slate-900 uppercase tracking-wider">02. Logistique d'Expédition</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Expéditeur & Contact / Sender <span class="text-red-600">*</span></label>
                    <input type="text" name="expediteur" required class="md:col-span-2 w-full font-medium text-xs sm:text-sm bg-slate-50 border-2 border-slate-900 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Date d'expédition / Sending date <span class="text-red-600">*</span></label>
                    <input type="date" name="date_expedition" required class="md:col-span-2 w-full font-mono text-xs sm:text-sm font-bold bg-slate-50 border-2 border-slate-900 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Nombre Échantillons / Résultats <span class="text-red-600">*</span></label>
                    <input type="number" name="nombre_echantillon" required class="md:col-span-2 w-full font-mono text-xs sm:text-sm font-bold bg-slate-50 border-2 border-slate-900 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Nom & Contact Du Transporteur <span class="text-red-600">*</span></label>
                    <select name="transporteur" id="transporteur" class="md:col-span-2 w-full font-medium text-xs sm:text-sm bg-slate-50 border-2 border-slate-900 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                        {% for t in transporteurs %} <option value="{{ t.id }}">{{ t.nom }}</option> {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Moyen de transport <span class="text-red-600">*</span></label>
                    <select name="moyen_transport" class="md:col-span-2 w-full font-medium text-xs sm:text-sm bg-slate-50 border-2 border-slate-900 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                        {% for m in moyens_transport %} <option value="{{ m.id }}">{{ m.nom }}</option> {% endfor %}
                    </select>
                </div>
            </div>

            <!-- SECTION 3 : RÉCEPTION & LABORATOIRE -->
            <div class="space-y-4 pt-2">
                <div class="flex items-center gap-2 border-b-2 border-slate-900 pb-2">
                    <span class="w-2 h-2 bg-emerald-600 rounded-full"></span>
                    <h2 class="text-xs font-black font-mono text-slate-900 uppercase tracking-wider">03. Réception & Entrée Labo</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Nom Destinataire / Receiver <span class="text-red-600">*</span></label>
                    <input type="text" name="destinataire" class="md:col-span-2 w-full font-mono text-xs sm:text-sm font-bold bg-slate-100 border-2 border-slate-900 rounded-xl p-3 text-slate-700 cursor-not-allowed shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]" value="CIRCB" readonly>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Date de réception / Receipt date <span class="text-red-600">*</span></label>
                    <input type="date" name="date_reception" required class="md:col-span-2 w-full font-mono text-xs sm:text-sm font-bold bg-slate-50 border-2 border-slate-900 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Nom & Contact du Réceptionniste</label>
                    <input type="text" readonly value="{{ request.user.username }}" name="receptioniste" class="md:col-span-2 w-full font-mono text-xs sm:text-sm font-bold bg-slate-100 border-2 border-slate-900 rounded-xl p-3 text-slate-700 cursor-not-allowed shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide">Date d'entrée au Labo <span class="text-red-600">*</span></label>
                    <input type="date" name="date_entree_labo" required class="md:col-span-2 w-full font-mono text-xs sm:text-sm font-bold bg-slate-50 border-2 border-slate-900 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 items-start gap-4">
                    <label class="text-xs font-bold text-slate-800 uppercase tracking-wide pt-2">Observations</label>
                    <textarea name="observation" class="md:col-span-2 w-full font-medium text-xs sm:text-sm bg-slate-50 border-2 border-slate-900 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]" rows="3" placeholder="Remarques éventuelles sur l'état des colis ou des tubes..."></textarea>
                </div>
            </div>

            <!-- CHAMP CACHÉ NUMÉRO ORDRE -->
            <input type="hidden" id="numero_ordre" name="numero_ordre" value="{{ prochain_numero }}">

            <!-- BOUTONS D'ACTION -->
            <div class="flex items-center justify-end gap-4 pt-6 border-t-2 border-slate-900">
                <button type="button" onclick="window.history.back()" 
                        class="px-6 py-3 text-xs font-black font-mono uppercase tracking-wider text-slate-700 bg-slate-100 border-2 border-slate-900 rounded-xl hover:bg-slate-200 transition-all shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                    Annuler
                </button>
                <button type="submit" 
                        class="px-8 py-3 text-xs font-black font-mono uppercase tracking-wider text-white bg-slate-900 border-2 border-slate-900 rounded-xl hover:bg-cyan-700 transition-all shadow-[3px_3px_0px_0px_rgba(15,23,42,1)] active:translate-x-0.5 active:translate-y-0.5">
                    Enregistrer la fiche
                </button>
            </div>
        </form>
    </div>
</main>

<style>
    @keyframes slide-in { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .animate-toast { animation: slide-in 0.4s ease-out; }
</style>

<script>
    // 1. Logique notifications Toast
    const showToast = (message, isSuccess) => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `pointer-events-auto animate-toast px-6 py-4 rounded-xl shadow-2xl text-white font-semibold flex items-center gap-3 ${isSuccess ? 'bg-blue-600' : 'bg-red-600'}`;
        toast.innerHTML = `<span>${isSuccess ? '✅' : '❌'}</span><span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 5000);
    };

    // 2. Génération automatique du code
    const dateInput = document.getElementById('date_enregistrement');
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;

    const numInput = document.getElementById('numero_ordre');
    const codeDisplay = document.getElementById('code');

    dateInput.addEventListener('change', updateCode);

    function updateCode() {
        if (dateInput.value && numInput.value) {
            const d = new Date(dateInput.value);
            const dateStr = `${String(d.getDate()).padStart(2,'0')}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getFullYear()).slice(-2)}`;
            codeDisplay.value = `${dateStr}-${String(numInput.value).padStart(4,'0')}`;
        }
    }

    updateCode();

    // 3. Selects Dynamiques (AJAX)
    const updateSelect = (url, target, id, key) => {
        if (!id) return;
        fetch(url + id + '/')
            .then(r => r.json())
            .then(data => {
                target.innerHTML = '<option value="">Choisir...</option>';
                data[key].forEach(item => target.innerHTML += `<option value="${item.id}">${item.nom}</option>`);
                target.disabled = false;
                target.classList.remove('bg-slate-100', 'text-slate-500', 'border-slate-400');
                target.classList.add('bg-slate-50', 'text-slate-900', 'border-slate-900', 'shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]');
            });
    };

    document.getElementById('select-region').addEventListener('change', (e) => updateSelect('/search_district/', document.getElementById('select-district'), e.target.value, 'results'));
    document.getElementById('select-district').addEventListener('change', (e) => updateSelect('/search_fosa/', document.getElementById('select-fosa'), e.target.value, 'fosas'));
</script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Liste des messages générés dynamiquement par Django
    const messages = [
        {% if messages %}
            {% for message in messages %}
            {
                text: "{{ message|escapejs }}",
                type: "{{ message.tags|default:'info' }}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        {% endif %}
    ];

    // Déclenchement du Toast SweetAlert2 pour chaque message
    messages.forEach((msg) => {
        const Toast = Swal.mixin({
            toast: true,
            position: "top-end",
            showConfirmButton: false,
            timer: 4000,
            timerProgressBar: true,
            background: "#0f172a", 
            color: "#ffffff",
            didOpen: (toast) => {
                toast.onmouseenter = Swal.stopTimer;
                toast.onmouseleave = Swal.resumeTimer;
            }
        });

        Toast.fire({
            icon: msg.type === 'error' ? 'error' : 'success',
            title: msg.text
        });
    });
});
</script>
{% endblock %}

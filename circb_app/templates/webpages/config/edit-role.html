{% extends "../dashbord_hosp.html" %}

{% block main %}
<main class="flex-1 h-full min-h-0 overflow-y-auto p-4 bg-slate-100 flex flex-col gap-4 w-full">
<div class="p-6 bg-slate-100 min-h-screen">
    <div class="max-w-3xl mx-auto bg-white rounded-md shadow-sm border border-slate-300 overflow-hidden">
        
        <!-- En-tête de la carte (Style DHIS2 Header) -->
        <div class="px-6 py-4 bg-slate-800 text-white flex justify-between items-center">
            <div>
                <h1 class="text-base font-semibold tracking-wide">Gestion des Rôles & Permissions</h1>
                <p class="text-xs text-slate-300 mt-0.5">Modification des paramètres du groupe : <span class="font-medium text-white">{{ role.name }}</span></p>
            </div>
            <a href="/configurations/" class="text-xs text-slate-300 hover:text-white transition-colors flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Retour
            </a>
        </div>

        <form method="POST" class="p-6 space-y-5">
            {% csrf_token %}
            
            <!-- Nom du rôle -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Nom du rôle</label>
                <input type="text" name="nom_groupe" value="{{ role.name }}" required 
                       class="w-full px-3 py-2 bg-white border border-slate-300 rounded-md text-sm text-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-700 focus:border-blue-700 transition-all">
            </div>

            <!-- Liste des permissions (Panneau structuré) -->
            <div class="space-y-1.5">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Permissions associées</label>
                    <span class="text-[11px] text-slate-500 italic">Cochez les droits d'accès nécessaires</span>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 p-3 bg-slate-50 rounded-md border border-slate-300 max-h-96 overflow-y-auto">
                    {% for perm in permissions %}
                    <label class="flex items-start gap-2.5 p-2 bg-white rounded border border-slate-200 hover:border-blue-500 hover:bg-blue-50/30 cursor-pointer transition-all">
                        <input type="checkbox" name="permissions" value="{{ perm.id }}" 
                               {% if perm in role.permissions.all %}checked{% endif %}
                               class="mt-0.5 w-4 h-4 text-blue-700 rounded border-slate-300 focus:ring-blue-700">
                        <div class="flex flex-col">
                            <span class="text-xs font-medium text-slate-800">{{ perm.name }}</span>
                            <span class="text-[10px] text-slate-400 font-mono">{{ perm.codename }}</span>
                        </div>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <!-- Boutons d'action (Style Dashboard DHIS2) -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
                <a href="/configurations/" class="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold uppercase tracking-wider rounded-md transition-all">
                    Annuler
                </a>
                <button type="submit" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white text-xs font-semibold uppercase tracking-wider rounded-md shadow-sm transition-all">
                    Enregistrer les modifications
                </button>
            </div>
        </form>

    </div>
</div>
</main>

{% endblock %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur Serveur | MEDISYS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .cog-rotate {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full text-center">
        <div class="relative mb-10 flex justify-center">
            <div class="w-24 h-24 bg-slate-200 rounded-[2.5rem] flex items-center justify-center">
                <i class="fas fa-server text-4xl text-slate-500"></i>
            </div>
            <div class="absolute -top-2 -right-2 w-12 h-12 bg-red-100 rounded-full flex items-center justify-center border-4 border-white">
                <i class="fas fa-cog text-red-600 cog-rotate"></i>
            </div>
        </div>

        <h1 class="text-7xl font-black text-slate-900 mb-2 tracking-tighter">500</h1>
        <h2 class="text-xl font-extrabold text-slate-800 uppercase tracking-tight mb-4">Une erreur est survenue</h2>
        <p class="text-slate-500 text-sm leading-relaxed mb-10">
            Nos ingénieurs ont été alertés. Le système rencontre une difficulté technique temporaire. Veuillez nous excuser pour ce contretemps.
        </p>

        <div class="space-y-3">
            <button onclick="window.location.reload()" class="w-full px-8 py-4 bg-red-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-red-700 transition-all shadow-xl shadow-red-200 flex items-center justify-center gap-3">
                <i class="fas fa-sync-alt"></i> Tenter de rafraîchir
            </button>
            
            <a href="/" class="w-full px-8 py-4 bg-white text-slate-600 border border-slate-200 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-slate-50 transition-all block">
                Retour à l'accueil
            </a>
        </div>

        <p class="mt-12 text-[9px] text-slate-400 font-bold uppercase tracking-[0.2em]">
            Identifiant de l'incident : <span class="text-slate-300">#HKM-{{ now|date:"U" }}</span>
        </p>
    </div>

</body>
</html>
